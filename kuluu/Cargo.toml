[package]
name = "kuluu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# dist's MSI (WiX) installer requires an authors field on the shipped package.
authors.workspace = true
description = "TUI/agent-driven client for LSB/Phoenix FFXI private servers."

[package.metadata.wix]
upgrade-guid = "8A763252-3E78-40EC-892D-5F38AEBE713C"
path-guid = "A4A3BB3C-3670-45CA-AD4F-6A74AFEFEE0F"
license = false
eula = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kuluu"
path = "src/main.rs"

[[example]]
# Headless replay of the single-authority walker over real MZB geometry
# (plan §4). Needs the viewer feature: the walker lives in `view_native`.
name = "zz-field-walk"
required-features = ["native-window"]

[features]
# The native windowed viewer is the mode we develop and ship by default, so
# enable it out of the box: a bare `cargo build`/`cargo test -p kuluu`
# then compiles `view_native` and runs its tests instead of silently skipping
# them (its tests only exist under this feature). DLSS is OPT-IN — local
# dev/test builds pass `--features dlss` explicitly; SDK-less environments
# (CI runners, release legs, Steam Deck docker) build with
# `--no-default-features --features native-window` so bevy/dlss never enters
# their link graph; the lean headless/relay-only binary (no Bevy) uses plain
# `--no-default-features`.
default = ["native-window"]
# Enable the native windowed viewer (`native` subcommand). Opens a real
# OS window via bevy_winit. Bevy's winit event loop must run on the OS
# main thread on macOS, so main.rs handles the dispatch specially when
# this feature is active.
native-window = [
    "dep:bevy",
    "dep:bevy_framepace",
    "dep:arboard",
    "dep:rfd",
    "dep:kuluu-render",
    "dep:kuluu-snapshot",
]
# Enhanced (non-retail) features are OPT-IN, never part of a default build:
# vanilla parity is the project default (AGENTS.md). The `?` keeps these from
# force-enabling the viewer dep outside native-window builds.
enhanced-buff-tooltips = ["kuluu-render?/enhanced-buff-tooltips"]
enhanced-cast-bar = ["kuluu-render?/enhanced-cast-bar"]
# Enhanced (non-retail) mob/pet HP readout on nameplates: the green bar under
# the billboard plate plus the "{name} {pct}%" suffix in the UI plates. Retail
# shows no mob HP; without this feature a persisted `mob_hp_under` can never
# light either, and the Debug -> Retail+ row does not exist.
enhanced-mob-hp-under = ["kuluu-render?/enhanced-mob-hp-under"]
# Enhanced (non-retail) party-frame Job column: L1 rows gain a job-icon column.
# Retail's party frame shows no jobs; without this feature a persisted
# `job_display` can never light it, and the Debug -> Retail+ row does not exist.
enhanced-job-display = ["kuluu-render?/enhanced-job-display"]
# Enable the WebSocket relay listener (`--relay-listen <addr>` global flag).
# Publishes the same `kuluu-snapshot` frames the in-process bridge produces,
# so external tools (and the future wasm browser viewer) can consume the
# state stream without the FFXI session having to know about them.
relay = ["kuluu-session/relay", "dep:kuluu-snapshot"]
# Per-system tracing. `bevy/trace_chrome` turns on Bevy's instrumentation spans
# (it implies `bevy/trace`); the chrome *layer* that records them is installed
# by us in main.rs, because this app disables Bevy's LogPlugin and owns the
# tracing subscriber. Run with `--features trace` to emit `trace-<n>.json` in
# CWD on clean exit; load in ui.perfetto.dev. Heavy — strictly for profiling.
trace = ["bevy/trace_chrome", "dep:tracing-chrome"]
# DEV-ONLY build-speed feature. Compiles Bevy as a shared `.dylib` so the
# final link of this large binary becomes a quick relink against the dylib
# instead of statically linking all of Bevy on every rebuild — the biggest
# edit->run win for a Bevy app. NEVER ship a release built with this (the
# binary then depends on libstd/bevy dylibs at the exact toolchain version).
# Combine with native-window, e.g.:
#   cargo run -p kuluu --features=native-window,relay,dynamic_linking
dynamic_linking = ["bevy/dynamic_linking"]
# NVIDIA DLSS Super Resolution. Implies the native viewer (DLSS is meaningless
# without a window) and lights up the DLSS rows in both graphics menus when
# the runtime supports it. OPT-IN: local dev/test builds pass `--features dlss`
# explicitly; SDK-less environments (CI runners, release legs, Steam Deck
# docker) simply don't, so bevy/dlss stays out of their link graph.
# Build-time requirements (DLSS SDK + Vulkan SDK + clang; dlss_wgpu's build.rs
# panics without DLSS_SDK) and the runtime DLL story live in docs/DLSS.md.
dlss = ["native-window", "kuluu-render/dlss", "bevy/dlss"]
# DEV-ONLY: the in-game Debug menu (page 2 of Commands, incl. its Retail+
# section with the DLSS/Job Display gates). Never part of a shipped release
# build — retail parity holds by construction; dev builds pass it explicitly,
# e.g. `cargo build -p kuluu --features debug-menu`. See kuluu-render's
# `debug-menu`.
debug-menu = ["kuluu-render?/debug-menu"]

[dependencies]
kuluu-session = { path = "../kuluu-session" }
ffxi-proto = { path = "../ffxi-proto" }
ffxi-vocab = { path = "../ffxi-vocab" }
kuluu-nav = { path = "../kuluu-nav" }
ffxi-nav-recast = { path = "../ffxi-nav-recast" }
ffxi-dat = { path = "../ffxi-dat" }

anyhow.workspace = true
clap.workspace = true
# Already linked transitively via ffxi-nav-recast with the identical
# default-features = false, features = ["tls"] spec, so the lock and binary are
# unchanged. The launcher's update check uses it for a CA-validated GitHub API
# GET; the client's own tls.rs is a TOFU verifier, unsuitable for public CAs.
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Chrome/Perfetto trace output for the `trace` feature. Installed manually in
# main.rs since this app owns its tracing subscriber (LogPlugin is disabled).
tracing-chrome = { version = "0.7", optional = true }
# Cross-platform secret storage (macOS Keychain / Windows Credential
# Manager / Linux Secret Service) for opt-in password remember on the
# launcher screen. v3 is the current stable line.
#
# keyring 3 ships every backend behind a feature — without one, `Entry`
# constructs fine but every get/set returns `NoStorageAccess`, silently
# breaking the Remember-password flow. We opt in to the native backend
# for each platform we ship binaries on.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

bevy = { workspace = true, optional = true, features = [
    # Bevy's official widget kit (button/checkbox/slider/radio/
    # toggle_switch/virtual_keyboard + dark theme), non-experimental since
    # 0.19. `bevy_feathers` transitively pulls `bevy_ui_widgets` (headless
    # primitives + `ValueChange` event), but we list both so a future split
    # doesn't silently lose widget support.
    "bevy_feathers",
    "bevy_ui_widgets",
] }
# Frame-rate limiter for the native window. The 0.21.x req is satisfied by
# the workspace [patch.crates-io] git pin (upstream's Bevy 0.19 migration PR,
# which keeps the 0.21.0 crate version); see kuluu-u11r.
# `default-features = false` strips the debug overlay we don't need.
bevy_framepace = { version = "0.22", optional = true, default-features = false }
# System clipboard. Used by `/copy` to push recent system-toast lines to
# the OS clipboard. Optional + gated on `native-window` because the
# headless/relay binary has no GUI session and no clipboard to write to.
arboard = { version = "3", optional = true, default-features = false }
# Native folder picker for the launcher Settings screen (FFXI_DAT_PATH /
# FFXI_NAVMESH_DIR "Browse…" buttons). On Linux we deliberately select the
# `xdg-portal` backend instead of rfd's default `gtk3` so the Steam Deck
# cross-build (docker/build-linux.sh) doesn't need GTK3 dev libs in the
# image — the portal talks to the desktop's file chooser over D-Bus.
# macOS / Windows ignore these Linux-only features and use the native
# Cocoa / Win32 dialogs. `tokio` satisfies the portal backend's
# async-runtime requirement; the launcher calls the *blocking* API from
# the winit main thread (never inside a tokio runtime), so no nesting.
rfd = { version = "0.15", optional = true, default-features = false, features = [
    "xdg-portal",
    "tokio",
] }

kuluu-snapshot = { path = "../kuluu-snapshot", optional = true }
kuluu-render = { path = "../kuluu-render", optional = true }

[dev-dependencies]
tempfile = "3"
# bevy_ecs routes failed-command diagnostics through the `log` facade; tests
# install a counting logger to assert zone teardown never reaches it.
log = "0.4"
