# Workspace-local cargo config.
#
# NOTE: a `[env] CXXFLAGS = "-isysroot /Library/Developer/CommandLineTools/..."`
# block used to live here as a workaround for a stale macOS Command Line Tools
# layout on one developer's machine (see git history). Cargo's `[env]` table is
# process-global — it can't be scoped to a target triple — so it pointed every
# C++ compile at a macOS-only sysroot. CI and the docker build already override
# `CXXFLAGS` per-platform (`.github/build-setup.yml`, `docker/build-linux.sh`),
# so the breakage was confined to native local dev builds off the docker path:
# a non-macOS developer building `cxx`/`recastnavigation-rs` directly (e.g. the
# Fedora-toolbox Steam Deck build) had the sysroot leak in.
# Removed. A developer whose local Command Line Tools layout still needs the
# override should set `CXXFLAGS` in their personal `~/.cargo/config.toml` (or
# export `CXXFLAGS="-isysroot $(xcrun --show-sdk-path)"`), not in this shared,
# cross-platform config.
#
# ## Build-speed tuning
#
# Enables the per-profile `codegen-backend` key used by [profile.dev] in the
# workspace Cargo.toml. Requires a nightly cargo (see rust-toolchain.toml).
# NOTE: this block makes a *stable* cargo error out, so every consumer of this
# repo must be on nightly — including the Steam Deck cross-build container
# (docker/Dockerfile.linux-build), which auto-switches to nightly because it
# bind-mounts this repo and reads rust-toolchain.toml. That build is --release,
# so Cranelift (dev-only) never runs there; it just uses LLVM.
[unstable]
codegen-backend = true
feature-unification = true
# Keep rustc metadata only in .rmeta files instead of also embedding it in
# every .rlib/.dylib (cargo -Zno-embed-metadata, cargo#16513). Shrinks target/
# -- the pressure that drives the bloat -> `cargo clean` -> 304s-cold-rebuild
# loop (kuluu-p5a5). Flipping this key either way invalidates the whole build
# cache once.
#
# -Zfine-grain-locking was evaluated at the same time and REJECTED (2026-08):
# its "waiting job blocks all other jobs" regression fix (cargo#16657) never
# merged, and it only parallelizes non-artifact commands like `check` -- our
# contention is between concurrent builds/tests, which it cannot parallelize.
# rust-analyzer already has its own target dir (.zed/settings.json).
no-embed-metadata = true

# Resolve features once across every workspace member, not per invocation.
#
# WHY: with the default per-invocation resolution, `cargo test -p kuluu-render`
# and `cargo build --workspace --features native-window` disagree about bevy's
# feature set (the narrow one loses `bevy_feathers`, which kuluu's
# native-window feature contributes). A different feature set is a different
# -C metadata hash, so the two invocations maintain SEPARATE artifact universes
# for bevy and everything above it. Measured on the unit graph: of the 461 units
# a per-package `cargo test` needs, 195 (42%) could not reuse the workspace
# build's artifacts. That duplication is what grows target/ until someone runs
# `cargo clean`, which then costs a 304s cold rebuild -- the loop that makes
# builds here feel slow, since the incremental edit loop itself is only 4-12s.
#
# Verified with `cargo build --unit-graph` (no compiling): this setting takes
# the forced-fresh share from 42% to 19%. It changes feature RESOLUTION only --
# `cargo test -p ffxi-dat` still does not pull bevy. Cost is one rebuild as the
# hashes settle. See bead kuluu-p5a5.
[resolver]
feature-unification = "workspace"

# NOTE: sccache was tried here and removed — measured 0.32% hit rate in this
# tree (it only helps clean/cross-machine rebuilds, not the incremental edit
# loop) while adding per-rustc wrapper overhead. Re-add `[build] rustc-wrapper
# = "sccache"` only if you start doing frequent from-scratch builds.

# Link the large client binary with LLVM lld instead of Apple ld. Modest here
# (Apple ld-1267 is already the fast "ld-prime") but still typically quicker on
# a binary this size. macOS-target-scoped, so the Linux/Deck cross-build is
# untouched. Install with `brew install lld` (the `ld64.lld` Mach-O driver
# lives in the standalone `lld` formula, not `llvm`).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=--ld-path=/opt/homebrew/opt/lld/bin/ld64.lld"]

# Project automation. `cargo xtask ffxi-client link` wires a retail FFXI install into
# vendor/game-files/ — see xtask/src/main.rs and the README "Getting the game
# files" section.
[alias]
xtask = "run --quiet --package xtask --"
