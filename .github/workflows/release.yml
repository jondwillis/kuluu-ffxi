name: Release

on:
  # Manual v-prefixed semver tag, e.g. `git push origin v0.2.0`. The trailing *
  # also admits prerelease/build suffixes like v0.2.0-rc1 or v0.0.0-wintest.
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # Called by auto-release-on-main.yml after a version-bump-driven tag.
  workflow_call:
    inputs:
      tag:
        description: Tag/version being released (e.g. 0.2.0).
        required: true
        type: string
  # Re-run a release by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag/version to release (e.g. 0.2.0).
        required: true
        type: string

permissions:
  contents: write

# Every build leg passes --no-default-features: dlss is opt-in and its runners
# have no DLSS SDK (dlss_wgpu's build.rs panics without DLSS_SDK), so the
# shipped binaries are built native-window-only. See docs/DLSS.md.

jobs:
  setup:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        shell: bash
        # `inputs.tag` must win over GITHUB_REF_NAME: on the workflow_call path a
        # reusable workflow inherits the CALLER's event context, so
        # `github.event_name` is still `push` and GITHUB_REF_NAME is `main`.
        # Branching on the event name there published a release tagged `main`.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "Releasing tag: ${tag}"
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to release non-version tag '${tag}'"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # Gate the release on the full CI suite (fmt, clippy, test) re-run against the
  # tagged commit. For the auto-release-on-main path CI already ran on the main
  # push, so this is belt-and-suspenders; for a manually pushed tag or
  # workflow_dispatch on an arbitrary commit it is the only check standing
  # between an unverified tree and published binaries.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  linux:
    name: Build (x86_64 Linux)
    needs: [setup, ci]
    runs-on: ubuntu-latest
    # Neutralise the macOS -isysroot CXXFLAGS from .cargo/config.toml on Linux
    # (see ci.yml) so the C++ Recast bridge builds.
    env:
      CXXFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-linux

      - name: Build binary
        run: cargo build --release --locked -p kuluu --no-default-features --features native-window

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          mkdir -p dist
          strip target/release/kuluu
          tar -C target/release -czf "dist/kuluu-${TAG}-x86_64-linux.tar.gz" kuluu

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  linux-arm:
    name: Build (aarch64 Linux)
    needs: [setup, ci]
    # GitHub's hosted arm64 runner (free for public repos) builds natively —
    # no cross toolchain, unlike the Deck's Rosetta-backed x86_64 pipeline.
    runs-on: ubuntu-24.04-arm
    env:
      CXXFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-linux-arm

      - name: Build binary
        run: cargo build --release --locked -p kuluu --no-default-features --features native-window

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          mkdir -p dist
          strip target/release/kuluu
          tar -C target/release -czf "dist/kuluu-${TAG}-aarch64-linux.tar.gz" kuluu

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm
          path: dist/*

  macos:
    name: Build (aarch64 macOS)
    needs: [setup, ci]
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # .cargo/config.toml pins target.aarch64-apple-darwin.rustflags to a
      # dev-machine lld path (--ld-path=/opt/homebrew/opt/lld/bin/ld64.lld) that
      # doesn't exist on the runner, breaking the link. RUSTFLAGS (higher cargo
      # precedence than target.<triple>.rustflags) wins and *replaces* it, so an
      # empty value drops the lld flag and falls back to the runner's default ld.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6

      # The committed .cargo/config.toml hardcodes a developer-machine CXXFLAGS
      # -isysroot for the Recast C++ bridge. Cargo's [env] is set without
      # force=true, so exporting CXXFLAGS here (pointing at the runner's actual
      # SDK) takes precedence — no edit to the tracked config needed.
      - name: Point CXXFLAGS at the runner SDK
        run: echo "CXXFLAGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-macos

      - name: Build binary
        run: cargo build --release --locked -p kuluu --no-default-features --features native-window

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          mkdir -p dist
          strip target/release/kuluu
          # strip invalidates the linker's ad-hoc signature on arm64, which makes
          # the binary fail to launch ("killed: 9"); re-sign ad-hoc to restore it.
          codesign --force --sign - target/release/kuluu
          tar -C target/release -czf "dist/kuluu-${TAG}-aarch64-macos.tar.gz" kuluu

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    name: Build (x86_64 Windows)
    needs: [setup, ci]
    runs-on: windows-latest
    # .cargo/config.toml's [env] pins CXXFLAGS to a macOS -isysroot for the
    # Recast C++ bridge; MSVC's cl.exe can't parse it. Cargo's non-forced [env]
    # yields to a var already in the environment (same trick as ci.yml on
    # Linux), so an empty value here wins and the bridge builds against the
    # runner's MSVC toolchain. RUSTFLAGS is safe to set: the lld link-arg in
    # .cargo/config.toml is scoped to target.aarch64-apple-darwin only.
    #
    # crt-static embeds the MSVC C runtime so the shipped exe has no
    # VCRUNTIME140.dll import — Rust's MSVC targets link the CRT dynamically
    # by default, and a machine without the matching-arch VC++ redistributable
    # (common on fresh Windows-on-ARM; masked on x86_64 by the redist's
    # ubiquity) fails at launch with the missing-DLL dialog (kuluu-ddgn).
    # The cc-built Recast bridge follows the target feature (/MT).
    env:
      CXXFLAGS: ""
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-windows

      - name: Build binary
        run: cargo build --release --locked -p kuluu --no-default-features --features native-window

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        # Default shell on windows-latest is PowerShell. MSVC emits debug info
        # into a separate .pdb, so the .exe ships lean without a strip step.
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/kuluu.exe -DestinationPath "dist/kuluu-$env:TAG-x86_64-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  windows-arm:
    name: Build (aarch64 Windows)
    # Native aarch64-pc-windows-msvc build on GitHub's hosted arm64 Windows
    # runner (free for public repos). Serves Snapdragon laptops and Windows-on-
    # ARM VMs (Parallels on Apple Silicon), which otherwise run the x86_64
    # build under Prism emulation. Same CXXFLAGS blanking as the x86_64 leg so
    # the Recast C++ bridge builds with the runner's MSVC arm64 toolchain, and
    # the same crt-static as the x86_64 leg: fresh Windows-on-ARM machines
    # rarely have the ARM64 VC++ redistributable, so a dynamically-linked CRT
    # fails at launch with the missing-VCRUNTIME140.dll dialog (kuluu-ddgn).
    needs: [setup, ci]
    runs-on: windows-11-arm
    env:
      CXXFLAGS: ""
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-windows-arm

      # rust-toolchain.toml pins rustc-codegen-cranelift-preview, which rustup
      # does not distribute for aarch64-pc-windows-msvc — the rustup shim then
      # refuses every cargo call on this host. Cranelift is dev-only (release
      # builds use LLVM), so install the same pinned channel without the file's
      # component list and point RUSTUP_TOOLCHAIN at it, which makes rustup
      # ignore rust-toolchain.toml. The channel is read from the file so the
      # pinned date has a single source.
      - name: Bypass rust-toolchain.toml (no Cranelift dist for this host)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --locked -p kuluu --no-default-features --features native-window

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/kuluu.exe -DestinationPath "dist/kuluu-$env:TAG-aarch64-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm
          path: dist/*

  wasm:
    name: Build (browser WASM)
    needs: [setup, ci]
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build
        with:
          targets: wasm32-unknown-unknown
          cache-key: release-wasm

      # Trunk auto-downloads matching wasm-bindgen-cli and wasm-opt at build time.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build WASM bundle
        working-directory: kuluu-viewer-wasm
        run: trunk build --release

      - name: Package
        env:
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          mkdir -p dist
          ( cd kuluu-viewer-wasm/dist && zip -r "../../dist/kuluu-viewer-wasm-${TAG}.zip" . )

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [setup, linux, linux-arm, macos, windows, windows-arm, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # SHA256SUMS pins the integrity contract the in-app updater verifies
      # against (kuluu/src/view_native/launcher_ui/updater.rs). Hash the
      # bare basenames so each line matches the asset filename the updater
      # downloads, not the runner's artifacts/ directory prefix.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
