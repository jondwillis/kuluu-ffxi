name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - kuluu/assets/branding/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site with the branding assets it references
        run: |
          mkdir -p _site/assets
          cp site/* _site/
          cp kuluu/assets/branding/png/kuluu-32.png kuluu/assets/branding/png/kuluu-256.png \
             kuluu/assets/branding/social/github-preview.png _site/assets/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
